packages:
  - frontend
  - backend
  - packages/*
overrides:
  # @ai-sdk/otel pins an exact ai version; share the workspace's ai so its telemetry matches the ai that sends the events
  '@ai-sdk/otel>ai': ^7.0.141
  # Security fixes the dependents' own ranges don't reach yet: eslint, @eslint/config-array, @typescript-eslint/typescript-estree,
  # graphql-config and nodemon still require minimatch ^10 (GHSA-g3hv-75wg-m249), and @tailwindcss/typography pins
  # postcss-selector-parser 6.0.10 (GHSA-rj75-hqrm-r3gf). Keep each until no package in the lockfile requires a vulnerable range
  'minimatch@>=7.0.0 <11.0.1': ^11.0.5
  'postcss-selector-parser@<6.1.5': ^6.1.5
allowBuilds:
  '@apollo/protobufjs': true
  aws-sdk: true
  es5-ext: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@langchain/openai@1.6.2'
  - '@graphql-tools/schema@10.1.5'
