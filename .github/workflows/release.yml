name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check frontend version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Compare the release tag with frontend/package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error file=frontend/package.json::Release tag $TAG does not match the frontend version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: Publish ${{ matrix.workspace }} image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Image metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.workspace }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
          build-args: |
            LUMI_VERSION=${{ needs.version.outputs.version }}
            COMMIT_ID=${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.licenses=${{ matrix.workspace == 'frontend' && 'AGPL-3.0-only AND Apache-2.0' || 'AGPL-3.0-only' }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.workspace }}
